name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          release-type: dart
          # Must be a PAT (or GitHub App token), not GITHUB_TOKEN: tags pushed with GITHUB_TOKEN
          # don't trigger other workflows, so publish.yml would never run.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
