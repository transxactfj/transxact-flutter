name: Publish to pub.dev

# pub.dev only accepts OIDC publishes from tag pushes, so this fires on the tag Release Please creates.
# Needs the tag pattern `v{{version}}` set under the package's Admin > Automated publishing on pub.dev.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # pub.dev OIDC authentication

    steps:
      - uses: actions/checkout@v4

      # Exchanges the OIDC token for a pub.dev credential; Flutter's bundled dart reads the same pub config.
      - uses: dart-lang/setup-dart@v1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Tag matches pubspec version
        run: |
          version="$(sed -n 's/^version: *//p' pubspec.yaml)"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pubspec version $version" >&2
            exit 1
          fi

      - run: flutter analyze

      - run: flutter test

      - run: flutter pub publish --dry-run

      - run: flutter pub publish --force
